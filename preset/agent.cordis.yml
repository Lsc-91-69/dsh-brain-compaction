# 人脑式上下文压缩 —— agent preset（AGENT 平面组合）──────────────────────────
#
# 与 DSH 0.1.5 的 shipped `standard` 预设同构：roster 把本文件挂一次（standing
# scope），每个选择本预设的会话以 scope 父子关系加入，因此这里注册的工具与
# prompt section 覆盖每个加入的 agent，而会话自身状态按 Session/Agent 键在
# 插件内部隔离。host 组合（base.cordis.yml + web.cordis.yml）保留预设绝不能
# 拥有的东西：注册表本身、sandbox 与审批栈、持久化、模型路由。
#
# 本文件里的服务行**必须**放在带 `isolate` realm 的 group 内：没有 realm 就会
# 发布到 root realm（进程全局），第二个会话挂载同一预设时直接撞名，且 host 侧
# 读者会拿到"某个预设的实例"；`dsh-agent-presets` 在挂载期就会拒绝。
# `true` = 每个挂载条目私有的 realm（多个预设之间互不可见）。字符串标签只是
# 把子树并入同一 realm，**不会**共享实例（同一 symbol 二次 provide 仍抛错）。
#
# 与 `standard` 的差异（本预设的全部意义所在）：
#   1. persona 换成"压缩纪律"版本；
#   2. compaction group 里用 **dsh-argp** 顶替 `@deepseek-ai/dsh-compaction-basic`
#      （0-LLM 原子引用图剪枝 + 选择性遗忘 + 按 seq 精确召回）。
#
# ── DSH 0.1.5 适配 ─────────────────────────────────────────────────────────
#   - 引擎行 dsh-argp 需 **^1.1.0**（其 peerDependencies 明确 ^0.1.5-rc.1，
#     并且自身也走 0.1.5 的 `ctx.settings.installSection()` 源 thunk）。
#   - `@deepseek-ai/dsh-compaction-instant` **暂不可用**：0.1.4 仍 import 已删除
#     的包级 installSettingsSection / settingsNamespace，一旦在本 group 内启用
#     即模块求值期抛错（下方保留注释行仅作占位，等上游适配）。
#   - `tokenMeter` 刻意**不**进本 realm：meter 属 HOST 平面，这里各行解析的是
#     host 上那一个实例——它不接配置、按 Session 折叠、还拥有浏览器读取的
#     context-meter 投影单元；放进 realm 会让这些单元随"恰好挂载了哪些预设"
#     忽有忽无。预设在此只决定"该 agent 是否压缩"，即下面的 dsh-argp 行。
#
# ── 复制到本机（README 有完整说明）─────────────────────────────────────────
#   复制 preset/ 目录到 $DSH_HOME/.agent-presets/brain-compaction/
#   （$DSH_HOME 默认 ~/.dsh；本部署 = D:\DeepSeekHarness\.dsh）
#   然后在会话的预设选择器里选「人脑式上下文压缩」。

# ── identity ────────────────────────────────────────────────────────────────

# 本预设的 persona，遮蔽部署默认值。`{{model}}` / `{{cwd}}` 由 agent 自身的
# 路由与工作目录解析。写的是"纪律"，不是"能力清单"：只列真正能用的通道，
# 避免模型去调一个默认禁用的引擎工具。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.
      This session runs the 人脑式上下文压缩 (brain compaction) system. Practise the discipline:
      - Start sensitive work with brain_status, and verify the compression layer with brain_verify (matrix PASS/SKIP/FAIL + token snapshot). Report component issues instead of silently adapting.
      - Content elided by compaction is recoverable, never guess it. On the default engine (dsh-argp) locate the seq with list_pruned or recall, then recover it with brain_recall(seq) or recall_pruned; when you know the gist but not the seq, use brain_recall(query).
      - If a tool output was replaced by a CCR hash (Headroom), restore it with headroom_retrieve before citing it. Headroom ships disabled by default; do not assume it is on.
      - Cross-session facts go to the memory vault: memory_remember for stable facts and decisions, memory_recall before acting on remembered context, memory_forget for corrections.
      - Route every task with the We-Need chain (0 extra LLM calls, mirrors dsh-routing-suite): classify up front — maintenance/investigation work (fix/diagnose/review/audit/migrate/refactor/optimize) means inspect the relevant facts first, identify the root cause, then make the smallest justified change and verify it; creation/implementation work (build/create/implement/generate/scaffold/write) means move directly toward a usable result, keep the design proportional, and verify the finished behavior. Never burn exploration tokens on direct tasks; never skip root cause on maintenance tasks.
      - MCP capabilities are lazy: mcp_search first, then mcp_call with an exact schema. Large catalogs never load wholesale.
      - Only hard dependencies from the compaction layer: recall before reconstructing, remember before forgetting, audit before optimizing. When in doubt, call brain_status.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` 留在 HOST 组合：apps/cli/src/web.ts 注入它来发布
# DSH_WEB_URL / DSH_WEB_MODE，而"host 行注入服务"正是 host 平面归属的判据——
# 注入在任何会话存在之前解析，没有 agent 可键。放进预设 realm 后这些环境变量
# 根本到不了模型侧 shell。两个 shell 工具都从预设解析 host 注册表；执行器
# （bash-sandbox / pwsh-sandbox）同样属 host 平面。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# 两行都只注册进 host 的 `tools` 注册表、不 provide 任何服务，因此不需要 realm。
# `fs` 服务与其 policy 留在 host。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# 只有模型面控件。任务注册表留在 host 平面：它的生产者在本文件能给的任何
# realm 之外——上面的 tool-bash 用 ctx.get 解析它，而条目私有 realm 对每个
# 兄弟行都不可见，于是 run_in_background 会答"background jobs unavailable"
# 而这些控件还列在目录里。注册表本来就按 owning agent 键，一个 host 实例
# 服务所有会话。预设选择的是"本 agent 能否收集与停止后台工作"。
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# 技能注册表在 host 组合里，按 scope 分层：这两行注册进**本预设这一层**，
# 所以不需要 realm。skill-filesystem 为本预设的 agent 贡献本地根发现，
# tool-skill 给它们目录与加载器；合并后的目录还带着部署全局注册的东西。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# 只有模型面工具。goal 服务、其会话驱动与 /goal 命令都留在 host 平面：
# Gateway 把 goal 域作为 Remote 端点提供，其 receiver 来自生成的 descriptor，
# 因此在 host 上解析 goals，条目私有 realm 在这里会把它藏起来。注册表本来就
# 按会话键，一个 host 实例服务所有会话。
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# 计划状态天生按 agent 隔离，所以这里的条目私有 realm 不是权宜之计，而是
# 正确的生存期。
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# 引擎互斥：ctx.compaction 每上下文只允许一个实现。默认 dsh-argp（0-LLM 原子
# 引用图剪枝、精确压缩率、选择性遗忘）。改用备选引擎时：给本行加 disabled: true
# 并启用下方注释行（/compact 命令与 tool-result-pruner 在这里一起提供；
# host bundle 的 patch 里也有同名的 host 级引擎行，服务于不带压缩组的预设——
# 切换时两处要保持一致，见 README「引擎切换」）。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    # DSH 0.1.5 适配基线：dsh-argp ^1.1.0。
    - id: compaction-argp
      name: dsh-argp
      config:
        maxPasses: 256
        recencyGuard: 10

    # ⚠️ 备选引擎 dsh-compaction-instant@0.1.4 在 DSH 0.1.5 上不可用
    #    （仍 import 已删除的 installSettingsSection / settingsNamespace）。
    #    上游适配后取消注释、并给上面的 argp 行加 disabled: true。
    # - id: compaction-instant
    #   name: dsh-compaction-instant

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# `subagents` 注册表与其 spawn/fork 后端在 HOST 组合：注册表是进程单例，浏览器
# 侧的跨会话查询由 api-proxy 提供，而一个 provider 名只能注册一次。本预设只
# 贡献委派**工具**，它们解析那个 host 注册表。
#
# `workflows` 不同——agent 之外没有读者——所以每条触达它的行共享这里的一个
# 条目私有 realm；留在外面的消费者会解析到一个本预设并未填充的 host 注册表。
#
# `tool-subagent-report` 出于与注册表相同的理由属 host 平面，而不是"预设不能
# 要它"：它在那个单例上注册 CONTINUABLE SETUP，而非本 agent 调用的工具，且
# setup 列表不分 scope——每个已挂载预设一份，意味着每个子 agent 在每个活会话
# 上都会注册一次 `report`，第二次即抛错。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # 生产版 dsh 不安装这两个可选 provider。先在本 Profile 安装对应的
    # Bundle 并重启 Host，再复制本预设、去掉对应工具行的 `disabled`。
    # Host 侧"在场"本身不授予任何工具。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# `web` 服务与其搜索 provider 留在 host 组合；只有模型面工具是按会话的。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
